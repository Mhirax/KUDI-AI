<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kudi AI Bank - API Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f5f5f5;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            color: #666;
        }
        
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        
        .module-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .module-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .module-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .endpoint-count {
            background: #f0f0f0;
            color: #667eea;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            font-size: 0.9em;
        }
        
        .endpoints-section {
            padding: 30px;
        }
        
        .module-section {
            margin-bottom: 40px;
        }
        
        .module-title {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .module-title h2 {
            color: #667eea;
            font-size: 1.8em;
            margin-right: 15px;
        }
        
        .endpoint-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        
        .endpoint-table thead {
            background: #f5f5f5;
        }
        
        .endpoint-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        
        .endpoint-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .method-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85em;
            min-width: 60px;
            text-align: center;
            color: white;
        }
        
        .method-get {
            background: #4CAF50;
        }
        
        .method-post {
            background: #2196F3;
        }
        
        .method-put {
            background: #FF9800;
        }
        
        .method-delete {
            background: #f44336;
        }
        
        .method-patch {
            background: #9C27B0;
        }
        
        .endpoint-path {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 6px 10px;
            border-radius: 4px;
            color: #d63031;
            font-weight: 500;
        }
        
        .search-box {
            padding: 30px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
        }
        
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        footer {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .copy-btn {
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }
        
        .copy-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Kudi AI Bank</h1>
            <p>Complete API Documentation - Enterprise Banking Platform</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <h3>59</h3>
                <p>Total Endpoints</p>
            </div>
            <div class="stat-card">
                <h3>12</h3>
                <p>Modules</p>
            </div>
            <div class="stat-card">
                <h3>4</h3>
                <p>Microservices</p>
            </div>
            <div class="stat-card">
                <h3>v1.0</h3>
                <p>API Version</p>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search endpoints (e.g., 'login', 'transfer', 'account')">
        </div>
        
        <div class="endpoints-section" id="endpointsContainer">
            <div style="text-align: center; padding: 40px;">
                <p>Loading endpoints...</p>
            </div>
        </div>
        
        <footer>
            <p>Kudi AI Bank API Documentation | Generated August 1, 2026</p>
            <p>Production Ready • Enterprise Grade • Fully Documented</p>
        </footer>
    </div>
    
    <script>
        const endpoints = {
            'Identity': [
                { method: 'POST', path: 'auth/register' },
                { method: 'POST', path: 'auth/login' },
                { method: 'POST', path: 'auth/refresh' },
                { method: 'POST', path: 'auth/logout' },
                { method: 'POST', path: 'auth/change-password' },
                { method: 'GET', path: 'users/me' },
                { method: 'GET', path: 'users/:userId' }
            ],
            'Accounts': [
                { method: 'POST', path: 'accounts' },
                { method: 'GET', path: 'accounts/me' },
                { method: 'GET', path: 'accounts/:accountId' },
                { method: 'POST', path: 'accounts/:accountId/credit' },
                { method: 'POST', path: 'accounts/:accountId/debit' },
                { method: 'POST', path: 'accounts/:accountId/freeze' },
                { method: 'POST', path: 'accounts/:accountId/unfreeze' }
            ],
            'Transfers': [
                { method: 'POST', path: 'transfers/internal' },
                { method: 'POST', path: 'transfers/external' },
                { method: 'GET', path: 'transfers/me' },
                { method: 'GET', path: 'transfers/:reference' }
            ],
            'Cards': [
                { method: 'POST', path: 'cards/create-virtual' },
                { method: 'POST', path: 'cards/request-physical' },
                { method: 'GET', path: 'cards' },
                { method: 'GET', path: 'cards/:id' },
                { method: 'POST', path: 'cards/:id/freeze' },
                { method: 'POST', path: 'cards/:id/unfreeze' },
                { method: 'POST', path: 'cards/:id/terminate' }
            ],
            'Compliance': [
                { method: 'GET', path: 'kyc/me' },
                { method: 'POST', path: 'kyc/verify-bvn' },
                { method: 'POST', path: 'kyc/verify-nin' }
            ],
            'Funding': [
                { method: 'POST', path: 'funding/virtual-accounts' },
                { method: 'GET', path: 'funding/virtual-accounts/me' },
                { method: 'POST', path: 'funding/checkout' },
                { method: 'GET', path: 'funding/deposits/me' },
                { method: 'GET', path: 'funding/deposits/:reference' }
            ],
            'Ledger': [
                { method: 'GET', path: 'ledger/accounts/:accountId/entries' },
                { method: 'GET', path: 'ledger/accounts/:accountId/statement' },
                { method: 'GET', path: 'ledger/entries/:entryId' }
            ],
            'Bills': [
                { method: 'GET', path: 'bills/billers' },
                { method: 'POST', path: 'bills/validate-customer' },
                { method: 'POST', path: 'bills/pay' },
                { method: 'GET', path: 'bills/me' },
                { method: 'GET', path: 'bills/:reference' },
                { method: 'POST', path: 'bills/:reference/refresh-status' }
            ],
            'Loans': [
                { method: 'POST', path: 'loans/apply' },
                { method: 'GET', path: 'loans' },
                { method: 'GET', path: 'loans/:id' },
                { method: 'POST', path: 'loans/:id/approve' },
                { method: 'POST', path: 'loans/:id/disburse' }
            ],
            'Rewards': [
                { method: 'GET', path: 'rewards' },
                { method: 'GET', path: 'rewards/history' },
                { method: 'POST', path: 'rewards/redeem' }
            ],
            'Savings': [
                { method: 'POST', path: 'savings/create' },
                { method: 'GET', path: 'savings' },
                { method: 'GET', path: 'savings/:id' },
                { method: 'POST', path: 'savings/:id/deposit' },
                { method: 'POST', path: 'savings/:id/withdraw' }
            ],
            'Notifications': [
                { method: 'GET', path: 'notifications/me' },
                { method: 'GET', path: 'notifications/me/unread-count' },
                { method: 'POST', path: 'notifications/:id/read' },
                { method: 'POST', path: 'notifications/read-all' }
            ]
        };
        
        function getMethodColor(method) {
            const colors = {
                'GET': 'method-get',
                'POST': 'method-post',
                'PUT': 'method-put',
                'DELETE': 'method-delete',
                'PATCH': 'method-patch'
            };
            return colors[method] || '';
        }
        
        function renderEndpoints(searchTerm = '') {
            const container = document.getElementById('endpointsContainer');
            let html = '';
            let totalCount = 0;
            
            for (const [module, eps] of Object.entries(endpoints)) {
                const filtered = eps.filter(ep => 
                    ep.path.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    ep.method.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    module.toLowerCase().includes(searchTerm.toLowerCase())
                );
                
                if (filtered.length > 0) {
                    totalCount += filtered.length;
                    html += `
                        <div class="module-section">
                            <div class="module-title">
                                <h2>${module}</h2>
                                <span class="endpoint-count">${filtered.length} endpoints</span>
                            </div>
                            <table class="endpoint-table">
                                <thead>
                                    <tr>
                                        <th>Method</th>
                                        <th>Endpoint</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    filtered.forEach(ep => {
                        html += `
                            <tr>
                                <td><span class="method-badge ${getMethodColor(ep.method)}">${ep.method}</span></td>
                                <td>
                                    <span class="endpoint-path">/api/v1/${ep.path}</span>
                                    <button class="copy-btn" onclick="copyToClipboard('/api/v1/${ep.path}')">Copy</button>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                }
            }
            
            if (totalCount === 0) {
                html = `<div style="text-align: center; padding: 40px; color: #999;">
                    No endpoints found matching your search.
                </div>`;
            }
            
            container.innerHTML = html;
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied: ' + text);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderEndpoints(e.target.value);
        });
        
        // Initial render
        renderEndpoints();
    </script>
</body>
</html>
