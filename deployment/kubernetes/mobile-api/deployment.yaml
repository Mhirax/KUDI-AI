apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-api
  namespace: kudi-ai-bank
  labels:
    app: mobile-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mobile-api
  template:
    metadata:
      labels:
        app: mobile-api
    spec:
      containers:
        - name: mobile-api
          image: ghcr.io/kudi-ai-bank/mobile-api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: kudi-shared-config
            - secretRef:
                name: kudi-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
