# Example only — real secrets must be provisioned via a secrets manager
# (e.g. External Secrets Operator + AWS Secrets Manager / Vault),
# never committed to source control.
apiVersion: v1
kind: Secret
metadata:
  name: kudi-secrets
  namespace: kudi-ai-bank
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/kudi"
  JWT_ACCESS_SECRET: "changeme"
  JWT_REFRESH_SECRET: "changeme"
  FLUTTERWAVE_SECRET_KEY: "changeme"
