apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: kudi-ai-bank
  labels:
    app: admin-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      containers:
        - name: admin-api
          image: ghcr.io/kudi-ai-bank/admin-api:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: kudi-shared-config
            - secretRef:
                name: kudi-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
